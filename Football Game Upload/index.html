<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridiron Dynasty</title>
<meta name="description" content="Be the offensive and defensive coordinator. Call every snap, build team chemistry, and turn an average team into a dynasty.">
<meta name="theme-color" content="#e4e6df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161813" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='50' rx='46' ry='28' transform='rotate(-35 50 50)' fill='%237b3f1a' stroke='%232e160a' stroke-width='4'/%3E%3Cpath d='M36 64L64 36M42 50l8 8M48 44l8 8M54 38l8 8' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Colors and fonts. The first block is the light look; the two dark blocks must match each other. */
:root{
  --ground:#e4e6df; --card:#f1f2ec; --ink:#1b1d17; --muted:#5a5f53; --line:#c3c7ba;
  --accent:#2a7565; --accent-ink:#ffffff;
  --good:#256b33; --good-bg:#d6e9d4; --warn:#8a5a0c; --warn-bg:#f1e2c2; --bad:#9c3420; --bad-bg:#f2d9d1;
  --greek:"Gentium Book Plus","Gentium Plus","Noto Serif","Palatino Linotype",Palatino,serif;
  --ui:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#161813; --card:#1f221b; --ink:#e8e8df; --muted:#a2a697; --line:#383c31;
    --accent:#5cb6a1; --accent-ink:#0d1a16;
    --good:#86cf8f; --good-bg:#1d3221; --warn:#e3b45c; --warn-bg:#3a2e14; --bad:#ec8a72; --bad-bg:#3c1f18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#161813; --card:#1f221b; --ink:#e8e8df; --muted:#a2a697; --line:#383c31;
  --accent:#5cb6a1; --accent-ink:#0d1a16;
  --good:#86cf8f; --good-bg:#1d3221; --warn:#e3b45c; --warn-bg:#3a2e14; --bad:#ec8a72; --bad-bg:#3c1f18;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;padding-inline:16px}
.app{max-width:44rem;margin:0 auto;padding-block:22px 56px;display:flex;flex-direction:column;gap:20px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{font:500 .85rem var(--ui);color:var(--muted);background:transparent;border:0;padding:.55em .9em;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.unitpick{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.unitpick select{font:500 .9rem var(--ui);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:.48em .7em;max-width:16rem}
.unitpick select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.btn{font:600 .95rem var(--ui);padding:.68em 1.15em;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{font-size:.8rem;padding:.4em .8em;font-weight:500}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.foot{color:var(--muted);font-size:.82rem;line-height:1.5;margin:10px 0 0}

/* toasts */
.toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none;width:min(92vw,26rem)}
.toast{background:var(--ink);color:var(--ground);border-radius:999px;padding:.5em 1.1em;font-size:.88rem;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.22);text-align:center;animation:pop .2s ease-out;max-width:100%;pointer-events:auto;cursor:pointer}
.toast b{font-size:1rem}
.toast small{display:block;font-size:.76rem;opacity:.8}
.toast.cash{background:var(--good);color:#fff}
.toast.ready,.toast.rank{background:var(--accent);color:var(--accent-ink)}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* the game frame */
.farm{display:flex;flex-direction:column;gap:16px}
.farm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.farm-head h2{font-family:var(--greek);font-size:1.8rem;margin:2px 0 0;font-weight:700;line-height:1.1}
.small-note{margin:0;font-size:.82rem}
.farmtabs{flex-wrap:wrap}
.farmtabs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.farmtabs button{padding:.5em .8em}
.tbadge{display:inline-block;min-width:1.4em;padding:0 .35em;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;line-height:1.4;text-align:center}
.farmtabs button[aria-pressed="true"] .tbadge{background:var(--ground);color:var(--ink)}
.farm-purse{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;font-size:.88rem;color:var(--muted)}
.farm-purse b{color:var(--ink);font-size:1.05rem;font-variant-numeric:tabular-nums}
.farm-purse b.neg{color:var(--bad)}
.farm-sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head .label{margin:0}
.muted{color:var(--muted)}
.sec-head .muted{font-size:.82rem}
.gbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good)}
.gbar.bad i{background:var(--bad)}
.shop-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.shop-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 8px}
.shop-row:not(:has(.thumb)){grid-template-columns:minmax(0,1fr) auto;padding-left:14px}
.thumb{width:56px;height:56px}
.thumb svg{width:100%;height:100%;display:block}
.sr-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.sr-name{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:.9rem}
.sr-meta{margin:0;font-size:.8rem;color:var(--muted)}
.done{font-size:.78rem;font-weight:600;color:var(--good);letter-spacing:.04em}
.buy2{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:480px){.shop-row{grid-template-columns:44px minmax(0,1fr)}.thumb{width:44px;height:44px}.shop-row > .btn,.shop-row > .done,.shop-row > .buy2{grid-column:2;justify-self:start;text-align:left}.shop-row:not(:has(.thumb)) > .buy2,.shop-row:not(:has(.thumb)) > .btn{grid-column:1}}
.farm-how{border-top:1px solid var(--line);padding-top:12px}
.farm-how summary{cursor:pointer;font-weight:600;font-size:.9rem}
.farm-how ul{margin:10px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);max-width:62ch}
.looks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:8px}
.look{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.look.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.look-name{font-size:.86rem;font-weight:500}
.sw{display:inline-flex;align-items:center;justify-content:center;height:34px}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.outfit{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.outfit select{font:500 .84rem var(--ui);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:.3em .5em;max-width:11rem}
.nameform{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nameform input{font:inherit;font-family:var(--greek);font-size:1rem;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:.35em .6em;width:11rem;max-width:100%}
.nameform input:focus-visible,.outfit select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* career: salary, goals, the end */
.bb-goals{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.bb-goals > div{display:flex;flex-direction:column;gap:4px}
.bb-warn{color:var(--bad);font-weight:600}
.bb-over{background:var(--card);border:2px solid var(--bad);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bb-over.wins{border-color:#d69a10;box-shadow:0 0 18px color-mix(in srgb,#d69a10 35%,transparent)}
.bb-over .label{margin:0}
.bb-over-head{margin:0;font-size:1.5rem;font-weight:800;line-height:1.2}

/* basketball (as in the original) */
.tdot{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;margin-right:.35em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tdot.big{width:1.6em;height:1.6em;margin:0}
.tok{display:block;flex:none}
.bb-team{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bb-team > div{flex:1;min-width:10rem}
.bb-tname{margin:0;font-size:1.25rem;font-weight:700}
.bb-next{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bb-next .label{margin:0}
.bb-next .gbar{align-self:stretch}
.bb-vs{margin:0;font-size:1.05rem;line-height:1.5}
.bb-last{margin:0}.bb-last.w b{color:var(--good)}.bb-last.l b{color:var(--warn)}
.bb-boosts{margin:0;padding-left:1.1em;font-size:.9rem}
.bb-five{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:6px}
.bb-five li{display:flex;align-items:center;gap:8px;font-size:.88rem}
.pcards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.r-legendary{box-shadow:0 0 0 1px var(--rc),0 0 14px color-mix(in srgb,var(--rc) 45%,transparent)}
.pcard.new{border-color:var(--rc)}
.pc-top{display:flex;align-items:center;gap:10px}
.pc-id{flex:1;min-width:0}
.pc-name{margin:0;font-weight:700;font-size:.95rem;line-height:1.25}
.pc-num{color:var(--muted);font-weight:500}
.pc-meta{margin:2px 0 0;font-size:.76rem;color:var(--muted);line-height:1.35}
.pc-rar{color:var(--rc);font-weight:700}
.pc-ovr{display:flex;flex-direction:column;align-items:center;line-height:1}
.pc-ovr b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.pc-ovr small{font-size:.62rem;letter-spacing:.08em;color:var(--muted)}
.pc-abs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.pc-abs.compact{grid-template-columns:1fr}
.pc-abs li{display:grid;grid-template-columns:2.4em minmax(0,1fr) 1.8em;align-items:center;gap:6px;font-size:.7rem}
.pc-abs span{color:var(--muted);font-weight:600;letter-spacing:.03em}
.pc-abs em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.abar{display:block;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.abar b{display:block;height:100%;background:var(--muted)}
.abar.mid b{background:var(--accent)}
.abar.hi b{background:var(--good)}
.pc-lvl{display:flex;flex-direction:column;gap:3px;font-size:.72rem}
.pc-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-acts .outfit{font-size:.78rem}
.buy2.left{justify-content:flex-start}
.bb-wait{border:2px dashed var(--accent);border-radius:12px;padding:12px}
.bb-reveal{position:fixed;inset:0;z-index:45;background:rgba(10,10,14,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.rv-box{background:var(--ground);border-radius:16px;padding:18px;width:min(100%,24rem);display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.rv-crate{animation:rvshake .9s ease-in-out both}
.rv-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;animation:rvflip .55s .85s cubic-bezier(.2,1.4,.4,1) both}
.rv-card .pcards{grid-template-columns:1fr;width:100%}
.rv-card .pcard{box-shadow:0 0 0 2px var(--rc),0 0 30px color-mix(in srgb,var(--rc) 60%,transparent)}
.rv-rar{margin:0;font-size:1.5rem;font-weight:800;color:var(--rc);letter-spacing:.04em;text-transform:uppercase}
.bb-reveal .rv-crate{position:absolute;top:30%;animation:rvshake .9s ease-in-out both,rvgone .2s .8s forwards}
@keyframes rvshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg) scale(1.05)}30%{transform:rotate(12deg) scale(1.1)}45%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(14deg) scale(1.2)}80%{transform:scale(1.35)}}
@keyframes rvgone{to{opacity:0;transform:scale(1.8)}}
@keyframes rvflip{from{opacity:0;transform:perspective(600px) rotateY(90deg) scale(.7)}to{opacity:1;transform:none}}
.bb-trbar{display:flex;flex-wrap:wrap;gap:10px}
.bb-trcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bb-trcols .pcards{grid-template-columns:1fr}
@media (max-width:640px){.bb-trcols{grid-template-columns:1fr}}
.bb-deal{margin:0;font-size:.9rem;font-weight:600}
.bb-trmsg{margin:0;padding:10px 12px;border-radius:9px;font-size:.92rem;line-height:1.45;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn)}
.bb-trmsg.ok{border-left-color:var(--good)}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch;overflow-x:auto;width:min(96vw,62rem);margin-left:calc(50% - min(48vw,31rem));padding-bottom:4px}
.bk-col{display:flex;flex-direction:column;gap:8px;min-width:10rem}
.bk-col .label{margin:0}
.bk-ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bk-m{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bk-t{display:grid;grid-template-columns:auto minmax(0,1fr) auto 2em;align-items:center;gap:4px;padding:5px 8px;font-size:.8rem}
.bk-t + .bk-t{border-top:1px solid var(--line)}
.bk-t b{text-align:right;font-variant-numeric:tabular-nums}
.bk-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-o{font-size:.7rem}
.bk-t.me{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.bk-t.won .bk-n{font-weight:700}
.bk-t.lost{opacity:.55}
.bk-t.tbd{color:var(--muted);display:block}
.bk-champ .bk-m{border:2px solid #d69a10}
@media (max-width:860px){.bracket{width:100%;margin-left:0}}
@media (max-width:640px){.bracket{grid-template-columns:repeat(4,10rem)}}
.bb-sim{width:min(96vw,80rem);margin-left:calc(50% - min(48vw,40rem));display:grid;grid-template-columns:minmax(0,1fr) minmax(16rem,22rem);gap:12px;align-items:stretch}
.bb-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.bb-court{display:block;width:100%;aspect-ratio:16/9;border-radius:8px;background:#a07c5d;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.bb-board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:#15161a;color:#f4f1e8;border-radius:10px;padding:8px 12px}
.bb-tm{display:flex;align-items:center;gap:8px;min-width:0}
.bb-tm.r{justify-content:flex-end}
.bb-tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.bb-tm b{font-size:1.7rem;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;color:#ffd23f}
.bb-clock{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-family:ui-monospace,Menlo,monospace}
.bb-clock b{font-size:.8rem;color:#9aa0aa}
.bb-clock span{font-size:1.15rem}
.bb-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bb-side{display:flex;flex-direction:column;gap:6px;min-height:0}
.bb-side .label{margin:0}
.bb-chat{list-style:none;margin:0;padding:6px;flex:1;min-height:16rem;max-height:calc(min(96vw,80rem) * .42);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:4px;font-size:.84rem;line-height:1.4}
.bb-chat li{border-left:4px solid var(--tc);padding:3px 8px;border-radius:3px;background:color-mix(in srgb,var(--tc) 9%,transparent)}
.bb-chat li.neutral{border-left-color:var(--muted);background:transparent;font-style:italic;color:var(--muted)}
.bb-chat b{font-weight:700}
@media (max-width:860px){.bb-sim{grid-template-columns:1fr;width:100%;margin-left:0}.bb-chat{max-height:18rem}}
.bb-box{display:flex;flex-direction:column;gap:6px}
.bb-box .label{margin:0}
.tscroll{overflow-x:auto}
.bb-box table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
.bb-box th,.bb-box td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.bb-box th:first-child,.bb-box td:first-child{text-align:left}
.bb-box td:first-child{display:flex;align-items:center;gap:6px}


/* football */
.good{color:var(--good)} .badt{color:var(--bad)}
.gbar.chem{height:10px}
.pc-abs.three{grid-template-columns:1fr 1fr}
.fb-field{display:block;width:100%;aspect-ratio:16/10;border-radius:8px;background:#2b5a29;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.fb-sit{margin:0;font-size:.92rem;font-variant-numeric:tabular-nums}
.fb-pos{color:#ffd23f;font-size:.7rem}
.fb-call{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.fb-role{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fb-role.o{color:var(--accent)} .fb-role.d{color:var(--bad)}
.fb-scout{margin:0}
.fb-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fb-opts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fb-opts.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.fb-opts.n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.fb-opts,.fb-opts.n4,.fb-opts.n2{grid-template-columns:1fr}}
.fb-opt{font:inherit;color:var(--ink);text-align:left;background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:10px 10px 10px 12px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;min-height:44px}
.fb-opt:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fb-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb-opt:disabled{opacity:.5;cursor:wait}
.fb-key{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:5px;background:var(--ink);color:var(--ground);font-size:.75rem;font-weight:700}
.fb-ob{display:flex;flex-direction:column;gap:3px;min-width:0}
.fb-on{font-size:1rem}
.fb-who{font-size:.86rem}
.fb-what{font-size:.8rem;color:var(--muted);line-height:1.35}
.fb-mu{font-size:.78rem}
.fb-bw{font-size:.74rem;color:var(--muted);line-height:1.35}
.chip{display:inline-block;padding:0 .4em;border-radius:5px;background:var(--line);font-variant-numeric:tabular-nums}
.chip.up{background:var(--good-bg);color:var(--good)} .chip.down{background:var(--bad-bg);color:var(--bad)}
.fb-res{border-left:4px solid var(--muted);padding:6px 10px;border-radius:4px;background:var(--ground);display:flex;flex-direction:column;gap:2px}
.fb-res p{margin:0}
.fb-res.good{border-left-color:var(--good)} .fb-res.bad{border-left-color:var(--bad)} .fb-res.ok{border-left-color:var(--warn)} .fb-res.even{border-left-color:var(--accent)}
.fb-grade{font-weight:700;font-size:.92rem}
.fb-res.good .fb-grade{color:var(--good)} .fb-res.bad .fb-grade{color:var(--bad)} .fb-res.ok .fb-grade{color:var(--warn)}
.fb-out{font-weight:600}
.fb-rec{font-size:.86rem;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:5px;padding:4px 8px;margin:2px 0 !important}
.fb-final{display:flex;flex-direction:column;gap:6px}
.fb-final .label,.fb-final p{margin:0}
.fb-tab{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
.fb-tab th,.fb-tab td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.fb-tab th:nth-child(2),.fb-tab td:nth-child(2){text-align:left}
.fb-tab tr.me{background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:600}
.fb-sty{font-size:.72rem;font-weight:400}
.fb-sched,.fb-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.fb-sched li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-po{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.fb-po .bk-m{padding-top:6px}.fb-po .label{padding:0 8px;margin:0 0 4px}
.bk-m{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bk-t{display:grid;grid-template-columns:minmax(0,1fr) 2em;align-items:center;gap:4px;padding:5px 8px;font-size:.84rem}
.bk-t + .bk-t{border-top:1px solid var(--line)}
.bk-t b{text-align:right;font-variant-numeric:tabular-nums}
.bk-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-t.me{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.bk-t.won .bk-n{font-weight:700}
.bk-t.lost{opacity:.55}
.bk-t.tbd{color:var(--muted);display:block}
.bb-team .outfit{flex-basis:auto}
.fb-pot{color:var(--accent);font-weight:600}
.bb-trbar{display:flex;flex-wrap:wrap;gap:10px}
.bb-trcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.bb-trcols{grid-template-columns:1fr}}
.bb-deal{margin:0;font-size:.9rem;font-weight:600}
.bb-trmsg{margin:0;padding:10px 12px;border-radius:9px;font-size:.92rem;line-height:1.45;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn)}
.bb-trmsg.ok{border-left-color:var(--good)}
.fb-tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.fb-trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 8px;font-size:.84rem}
.fb-trow.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fb-tn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fb-to{font-variant-numeric:tabular-nums;font-size:1rem}
.fb-pick{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--ground);font-size:.72rem;font-weight:700}
.fb-board td{vertical-align:middle}
.fb-board td:nth-child(2){text-align:left;white-space:normal}
.fb-board th:nth-child(2){text-align:left}
.pc-inj{margin:3px 0 0;font-size:.74rem;font-weight:600;color:var(--bad)}
.pc-inj.pc-camp{color:var(--accent)}
.fb-inj{font-size:.86rem;color:var(--bad);font-weight:600}
/* the snap bar: red until it's time, green to hike; the light strip drains as your window closes */
.fb-snap{position:relative;height:72px;border-radius:10px;background:#b3261e;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fb-snap.go{background:#17914a}
.fb-snap-fill{position:absolute;inset:0;background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(0)}
.fb-snap-txt{position:relative;color:#fff;font-weight:800;font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase}
.fb-snap.go .fb-snap-txt{font-size:1.5rem}
.fb-key-w{width:auto;padding:0 .45em}
.fb-snapres{font-weight:600}
/* the kick bar: the posts (shifted by the wind), the middle of the bar, and the sweeping marker */
.fb-kick{position:relative;height:72px;border-radius:10px;background:#21592b;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fb-kick-zone{position:absolute;top:0;bottom:0;background:rgba(255,210,63,.24)}
.fb-kick-post{position:absolute;top:8px;bottom:8px;width:4px;margin-left:-2px;border-radius:2px;background:#ffd23f}
.fb-kick-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3)}
.fb-kick-mark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.shop-row.bk-on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.shop-row .sr-meta .good,.shop-row .sr-meta .badt{font-weight:600}

/* phones */
@media (max-width:640px){
  body{padding-inline:12px}
  .app{padding-block:12px 40px;gap:14px}
  .btn{min-height:44px}
  .btn.small{min-height:36px}
  .unitpick{flex:1 1 100%;justify-content:space-between;min-width:0}
  .unitpick select{flex:1;width:100%;max-width:none;min-width:0;padding:.6em .7em}
  .seg button{padding:.6em .8em}
}
@media (prefers-reduced-motion: reduce){.toast{animation:none;transition:none}}
</style>
</head>
<body>
<main class="app">
  <section id="stage"></section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="gridiron.js"></script>
<script src="gridiron-lines.js"></script>
<script src="core.js"></script>
<script src="gridiron-game.js"></script>
<script>
/* The page: draw the game, and send taps, picks and forms to it. */
const $ = s => document.querySelector(s);
function render() { $('#stage').innerHTML = GM.gameView(); }
function focusAfter(sel) { const el = document.querySelector(sel); if (el) el.focus(); }
document.addEventListener('change', e => {
  if (e.target.dataset.gmFile) { GM.file(e.target, () => { render(); focusAfter('.sv-confirm .btn.primary, [data-gm="save-pick"]'); }); return; }
  if (!e.target.dataset.gmSel) return;
  GM.change(e.target); render();
  focusAfter(`[data-gm-sel="${e.target.dataset.gmSel}"][data-id="${e.target.dataset.id}"]`);
});
document.addEventListener('submit', e => {
  if (!e.target.dataset.gmForm) return;
  e.preventDefault(); GM.submit(e.target); render();
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !t.dataset.gm) return;
  const r = GM.click(t);
  if (r === 'rename') { render(); const inp = document.querySelector('.nameform input'); if (inp) { inp.focus(); inp.select(); } return; }
  render();
  if (r === 'top' || r === 'top-sec') $('#stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (e.detail === 0) {
    /* keyboard: keep focus on the same button after the redraw */
    const d = t.dataset, sel = '[data-gm="' + d.gm + '"]' + ['id', 'tab', 'slot'].filter(k => d[k] != null).map(k => `[data-${k}="${d[k]}"]`).join('');
    focusAfter(sel);
  }
});
GM.init();
render();
</script>
</body>
</html>
